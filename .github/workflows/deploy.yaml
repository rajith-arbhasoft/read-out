name: Deploy sql tool 

on:
  push:
    branches:
      - main

jobs:
  deploy: 
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install Vpn Client
        run: |
          sudo apt-get update
          sudo apt-get install -y openfortivpn

      - name: Create VPN Config File
        env:
          VPN_HOST: ${{ secrets.VPN_HOST }}
          VPN_HOST_PORT: ${{ secrets.VPN_HOST_PORT }}
          VPN_USER_NAME: ${{ secrets.VPN_USER_NAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
          VPN_TRUSTED_CERT: ${{ secrets.VPN_TRUSTED_CERT }}
        run: |
              printf '%s\n' \
              "host = ${VPN_HOST}" \
              "port = ${VPN_HOST_PORT}" \
              "username = ${VPN_USER_NAME}" \
              "password = ${VPN_PASSWORD}" \
              "trusted-cert = ${VPN_TRUSTED_CERT}" \
              "set-routes = 1" \
              "set-dns = 0" \
              > /tmp/openfortivpn.conf

              sudo chmod 600 /tmp/openfortivpn.conf

      - name: Connect to VPN
        run: |
          sudo openfortivpn -c /tmp/openfortivpn.conf > /tmp/vpn.log 2>&1 &
          echo $! > /tmp/vpn.pid
          sleep 10
          
          echo "===== VPN LOG ====="
          sudo cat /tmp/vpn.log

      - name: Test VPN Connection
        run: |
          sleep 10
          nc -zv ${{ secrets.SERVER_HOST }} 22
          
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER_NAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          capture_stdout: true
          script: cd /d E:\internal-tool\read-out && git status && git pull origin main && npm ci && npm run build && pm2 startOrReload ecosystem.config.js --update-env