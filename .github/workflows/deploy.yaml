name: Deploy sql tool 

on:
  push:
    branches:
      - main

jobs:
  deploy: 
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install Vpn Client
        run: |
          sudo apt-get update
          sudo apt-get install -y openfortivpn

      - name: Create VPN Config File
        run: |
          cat > /tmp/openfortivpn.conf <<EOF
          host = ${{ secrets.VPN_HOST }}
          port = ${{ secrets.VPN_PORT }}
          username = ${{ secrets.VPN_USER_NAME }}
          password = ${{ secrets.VPN_PASSWORD }}
          EOF
          sudo chmod 600 /tmp/openfortivpn.conf

      - name: Connect to VPN
        run: |
          sudo openfortivpn -c /tmp/openfortivpn.conf > /tmp/vpn.log 2>&1 &
          echo $! > /tmp/vpn.pid
          sleep 10

          echo "===== VPN LOG ====="
          sudo cat /tmp/vpn.log

      - name: Test VPN Connection
        run: |
          sleep 10
          ping -c 4 ${{ secrets.SERVER_HOST }}
          nc -zv ${{ secrets.SERVER_HOST }} 22
          
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd E:\internal-tool\read-out
            git pull origin main
            npm ci
            npm run build
            npm run start