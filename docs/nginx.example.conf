# Example only.
# Do not apply this file automatically.
# The server administrator chooses the hostname, TLS certificate, listen port,
# and the port where Next.js is running.

server {
    listen 443 ssl;
    server_name sql-tool.internal.example;

    # ssl_certificate     /path/chosen/by/administrator/fullchain.pem;
    # ssl_certificate_key /path/chosen/by/administrator/privkey.pem;

    client_max_body_size 1m;

    location / {
        # Replace 3000 if Next.js is started with a different PORT.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
